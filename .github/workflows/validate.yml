name: Validate Skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Review Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run skills review
        run: python3 scripts/review-skills.py . --strict

      - name: Validate plugin manifests
        run: |
          # Check that all JSON files are valid
          for f in $(find . -name "*.json" -path "*/.claude-plugin/*"); do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
