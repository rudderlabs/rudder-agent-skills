# Customer Properties
#
# Order, address and attribution properties. Referenced by the AddressType custom
# type and by both e-commerce tracking plans -- the web plan requires the page
# ones, the mobile plan requires the device ones. Same catalog, different rules.
version: "rudder/v1"
kind: "properties"
metadata:
  name: "customer-properties"
spec:
  properties:
    - config:
        format: "email"
      description: "Customer email address"
      id: "customer_email"
      name: "customer_email"
      type: "string"
    - config:
        max_length: 50
        min_length: 3
      description: "Unique order identifier"
      id: "order_id"
      name: "order_id"
      type: "string"
    - config:
        minimum: 0
      description: "Total order value"
      id: "order_total"
      name: "order_total"
      type: "number"
    - config:
        pattern: "^[A-Z]{3}$"
      description: "ISO 4217 currency code"
      id: "currency"
      name: "currency"
      type: "string"
    - config:
        max_length: 200
      description: "Street address"
      id: "address"
      name: "address"
      type: "string"
    - config:
        max_length: 100
      description: "City name"
      id: "city"
      name: "city"
      type: "string"
    - config:
        max_length: 100
      description: "State or province"
      id: "state"
      name: "state"
      type: "string"
    - config:
        max_length: 20
      description: "Postal or ZIP code"
      id: "zipcode"
      name: "zipcode"
      type: "string"
    - description: "Where the order ships to"
      id: "shipping_address"
      name: "shipping_address"
      type: "#custom-type:address_type"
    - description: "Address the payment method is registered to"
      id: "billing_address"
      name: "billing_address"
      type: "#custom-type:address_type"
    - config:
        max_length: 2048
      description: "URL of the current page"
      id: "page_url"
      name: "page_url"
      type: "string"
    - config:
        max_length: 2048
      description: "URL of the referring page"
      id: "referrer_url"
      name: "referrer_url"
      type: "string"
    - config:
        max_length: 100
        min_length: 10
      description: "Session identifier for grouping events"
      id: "session_id"
      name: "session_id"
      type: "string"
    - config:
        max_length: 100
        min_length: 10
      description: "Device identifier for mobile attribution"
      id: "device_id"
      name: "device_id"
      type: "string"
