# E-Commerce Events
#
# Core funnel: Product Viewed -> Product Added to Cart -> Order Completed.
#
# An event declares only its identity (id, wire name, type, category). Which
# properties it carries -- and whether they are required -- is decided by each
# tracking plan, so the same event can be stricter on mobile than on web.

version: rudder/v0.1
kind: events
metadata:
  name: ecommerce-events
spec:
  events:
    - id: product_viewed
      name: Product Viewed
      event_type: track
      description: "User viewed a product detail page"
      category: "#/categories/event-categories/ecommerce"

    - id: product_added_to_cart
      name: Product Added to Cart
      event_type: track
      description: "User added a product to their shopping cart"
      category: "#/categories/event-categories/ecommerce"

    - id: order_completed
      name: Order Completed
      event_type: track
      description: "Customer completed a purchase"
      category: "#/categories/event-categories/ecommerce"
