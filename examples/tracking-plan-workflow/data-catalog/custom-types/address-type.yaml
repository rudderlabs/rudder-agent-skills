# AddressType Custom Type
#
# Reusable object schema for shipping and billing addresses.
version: "rudder/v1"
kind: "custom-types"
metadata:
  name: "address-types"
spec:
  types:
    - description: "Address structure for shipping and billing"
      id: "address_type"
      name: "AddressType"
      properties:
        - property: "#property:address"
          required: true
        - property: "#property:city"
          required: true
        - property: "#property:state"
          required: true
        - property: "#property:zipcode"
          required: true
      type: "object"
