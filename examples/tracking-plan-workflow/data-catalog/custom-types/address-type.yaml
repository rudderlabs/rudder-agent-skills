# AddressType Custom Type
#
# Reusable object schema for shipping and billing addresses.

version: rudder/v0.1
kind: custom-types
metadata:
  name: address-types
spec:
  types:
    - id: address_type
      name: AddressType
      description: "Address structure for shipping and billing"
      type: object
      properties:
        - $ref: "#/properties/customer-properties/address"
          required: true
        - $ref: "#/properties/customer-properties/city"
          required: true
        - $ref: "#/properties/customer-properties/state"
          required: true
        - $ref: "#/properties/customer-properties/zipcode"
          required: true
