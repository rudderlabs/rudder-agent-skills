# ProductType Custom Type
#
# Reusable object schema for product information, referenced by the `product`
# property (single) and the `products` property (array of them).
version: "rudder/v1"
kind: "custom-types"
metadata:
  name: "product-types"
spec:
  types:
    - description: "Consolidated product information for e-commerce events"
      id: "product_type"
      name: "ProductType"
      properties:
        - property: "#property:product_id"
          required: true
        - property: "#property:product_sku"
          required: true
        - property: "#property:product_name"
          required: true
        - property: "#property:product_category"
          required: true
        - property: "#property:product_price"
          required: true
        - property: "#property:product_msrp"
          required: false
      type: "object"
