# ProductType Custom Type
#
# Reusable object schema for product information, referenced by the `product`
# property (single) and the `products` property (array of them).

version: rudder/v0.1
kind: custom-types
metadata:
  name: product-types
spec:
  types:
    - id: product_type
      name: ProductType
      description: "Consolidated product information for e-commerce events"
      type: object
      properties:
        - $ref: "#/properties/product-properties/product_id"
          required: true
        - $ref: "#/properties/product-properties/product_sku"
          required: true
        - $ref: "#/properties/product-properties/product_name"
          required: true
        - $ref: "#/properties/product-properties/product_category"
          required: true
        - $ref: "#/properties/product-properties/product_price"
          required: true
        - $ref: "#/properties/product-properties/product_msrp"
          required: false
