# Mobile App Tracking Plan
#
# iOS and Android. Same catalog as the web plan, stricter rules: device_id and
# session_id are required for mobile attribution, and unplanned properties are
# rejected rather than forwarded.
version: "rudder/v1"
kind: "tracking-plan"
metadata:
  name: "mobile-app"
spec:
  description: "E-commerce funnel for the mobile apps, with device attribution."
  display_name: "Mobile App Tracking Plan"
  id: "mobile_app"
  rules:
    - event: "#event:product_viewed"
      id: "product_viewed_rule"
      properties:
        - property: "#property:product"
          required: true
        - property: "#property:device_id"
          required: true
        - property: "#property:session_id"
          required: true
      type: "event_rule"
    - event: "#event:product_added_to_cart"
      id: "product_added_to_cart_rule"
      properties:
        - property: "#property:product"
          required: true
        - property: "#property:quantity"
          required: true
        - property: "#property:cart_total"
          required: false
        - property: "#property:device_id"
          required: true
        - property: "#property:session_id"
          required: true
      type: "event_rule"
    - event: "#event:order_completed"
      id: "order_completed_rule"
      properties:
        - property: "#property:products"
          required: true
        - property: "#property:order_id"
          required: true
        - property: "#property:order_total"
          required: true
        - property: "#property:customer_email"
          required: true
        - property: "#property:shipping_address"
          required: true
        - property: "#property:billing_address"
          required: true
        - property: "#property:device_id"
          required: true
        - property: "#property:session_id"
          required: true
      type: "event_rule"
