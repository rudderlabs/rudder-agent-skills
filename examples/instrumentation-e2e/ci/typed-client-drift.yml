# Copy into .github/workflows/ of the app that consumes a generated client.
#
# Why this exists
# ---------------
# `typer generate --local` reads YAML off a checkout, so the committed client is a
# build artifact of *another repository's* state. Nothing in the type system, the
# linter or the test suite notices when the two drift apart: a stale client is
# valid TypeScript that compiles, passes tests and silently emits the wrong shape.
#
# rudder-webapp, where this workflow was dogfooded, does not have this check today
# — the discipline lives only in CLAUDE.md and a skill, so it holds exactly as long
# as every author and reviewer remembers it. This job is the mechanical version.
#
# It catches:
#   - a call-site PR merged without regenerating
#   - a client generated from a wrong-branch or dirty catalog checkout
#   - a catalog change merged without the consumer being regenerated
name: Typed client drift

on:
  pull_request:
    paths:
      - 'src/analytics/generated/**'
      - 'package.json'
      - 'scripts/tp-sync.sh'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The catalog is the source of truth. Check out its DEFAULT branch, not the
      # PR author's branch: the question this job answers is "is the committed
      # client reproducible from catalog main?", which is what makes the merge
      # order (catalog first, consumer second) enforceable rather than advisory.
      - name: Check out the catalog
        uses: actions/checkout@v4
        with:
          repository: rudderlabs/rudder-data-gov
          path: .catalog
          token: ${{ secrets.CATALOG_READ_TOKEN }}

      # Pin the CLI. The generated header embeds the version that produced it, so an
      # unpinned CLI turns every release into a spurious diff. Bump this in the same
      # PR that commits a client regenerated with the newer CLI.
      - name: Install rudder-cli
        env:
          RUDDER_CLI_VERSION: 0.23.0
        run: |
          curl -fsSL "https://github.com/rudderlabs/rudder-iac/releases/download/v${RUDDER_CLI_VERSION}/rudder-cli_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin rudder-cli
          rudder-cli --version

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Committed client must match the catalog
        env:
          CATALOG_PATH: .catalog
        run: npm run tp:check
