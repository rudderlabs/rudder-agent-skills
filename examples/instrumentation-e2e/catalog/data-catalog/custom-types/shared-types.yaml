version: rudder/v0.1
kind: custom-types
metadata:
  name: shared-types
spec:
  types:
    - id: currency_type
      name: Currency_type
      description: "ISO-4217 currency the storefront prices in"
      type: string
      config:
        enum: ["usd", "eur", "gbp"]

    - id: plan_tier_type
      name: Plan_tier_type
      description: "Subscription tier the account is on"
      type: string
      config:
        enum: ["free", "pro", "enterprise"]
