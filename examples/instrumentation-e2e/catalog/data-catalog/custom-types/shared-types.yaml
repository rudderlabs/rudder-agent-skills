version: "rudder/v1"
kind: "custom-types"
metadata:
  name: "shared-types"
spec:
  types:
    - config:
        enum:
          - "usd"
          - "eur"
          - "gbp"
      description: "ISO-4217 currency the storefront prices in"
      id: "currency_type"
      name: "Currency_type"
      type: "string"
    - config:
        enum:
          - "free"
          - "pro"
          - "enterprise"
      description: "Subscription tier the account is on"
      id: "plan_tier_type"
      name: "Plan_tier_type"
      type: "string"
