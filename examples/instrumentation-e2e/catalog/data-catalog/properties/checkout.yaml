# Checkout Properties
#
# `coupon_code` is deliberately modelled optional: the storefront does not always
# know the coupon at checkout-start time. Marking it required would force a
# sentinel at the call site -- the exact mistake the rudder-webapp dogfooding
# found, where two required-but-usually-absent traits shipped for years.
version: "rudder/v1"
kind: "properties"
metadata:
  name: "storefront-checkout"
spec:
  properties:
    - config:
        min_length: 1
      description: "Identifier of the cart being checked out"
      id: "cart_id"
      name: "cartId"
      type: "string"
    - description: "Number of line items in the cart"
      id: "item_count"
      name: "itemCount"
      type: "integer"
    - description: "Cart total in minor units of the currency"
      id: "cart_total"
      name: "cartTotal"
      type: "number"
    - description: "Currency the cart is priced in"
      id: "currency"
      name: "currency"
      type: "#custom-type:currency_type"
    - config:
        enum:
          - "card"
          - "paypal"
          - "apple_pay"
      description: "How the shopper chose to pay"
      id: "payment_method"
      name: "paymentMethod"
      type: "string"
    - description: "Coupon applied to the cart, when the shopper entered one"
      id: "coupon_code"
      name: "couponCode"
      type: "string"
    - config:
        enum:
          - "closed_tab"
          - "payment_declined"
          - "navigated_away"
      description: "Why the shopper left checkout without completing"
      id: "abandonment_reason"
      name: "abandonmentReason"
      type: "string"
