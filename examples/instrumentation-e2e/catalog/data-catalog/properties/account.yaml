version: rudder/v0.1
kind: properties
metadata:
  name: storefront-account
spec:
  properties:
    - id: email
      name: email
      type: string
      description: "Account email address"

    - id: plan_tier
      name: planTier
      type: "#/custom-types/shared-types/plan_tier_type"
      description: "Subscription tier the account is on"
